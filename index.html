<!DOCTYPE html>
<html>
    <head>
        <title>Santa Run</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body class="body" onkeyup="keyCheck(event);">
        <div class="background" id="background">
            <div class="score" id="score">0</div>
            <img src="images/Idle (1).png" class="santa" id="santa"/>
        </div>
        <div class="gameOver" id="gameOver">
            <div>Game Over</div>
            <div>Your Score</div>
            <div id="endScore">0</div>

            <button class="b1" onclick="re();">Try Again</button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
