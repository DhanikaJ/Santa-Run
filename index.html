<!DOCTYPE html>
<html>
    <head>
        <title>Santa Run</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body class="body">
        <!-- Loading overlay - hides once all assets are preloaded -->
        <div class="loading" id="loading">
            <div class="loading-text">Loading Game...</div>
            <div class="loading-bar">
                <div class="loading-progress" id="loadingProgress" style="width: 0%"></div>
            </div>
            <div class="loading-info" id="loadingInfo">Loading 0 images...</div>
        </div>

        <div class="game-wrapper" id="gameWrapper">
            <div class="background" id="background">
                <div class="score" id="score">0</div>
                <img src="images/Idle_1.png" class="santa" id="santa"/>
            </div>
            <div class="gameOver" id="gameOver">
                <div class="t1">Game Over</div>
                <div>Your Score</div>
                <div id="endScore">0</div>

                <button class="b1" onclick="re();">Try Again</button>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
    <script>
        // Start preloading on page load
        document.addEventListener("DOMContentLoaded", function() {
            preloadAllAssets(function() {
                document.getElementById("loading").style.visibility = "hidden";
                document.getElementById("gameWrapper").style.visibility = "visible";
                enableKeyControls = true;
            });
        });
    </script>
</html>
